[project]
name = "ruflo-kb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.4.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "platformdirs>=4.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
