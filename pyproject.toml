[project]
name = "ruflo-kb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.4.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "platformdirs>=4.0",
    "mcp>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
# Treat all `async def test_*` as asyncio tests without requiring an
# explicit `@pytest.mark.asyncio` marker on every test. (STRICT mode
# was the source of the 4 mutex test failures.)
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
