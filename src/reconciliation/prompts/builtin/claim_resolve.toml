[meta]
prompt_kind = "claim_resolve"
version = "1.0"

[system]
text = """You are a V7 reconciliation claim resolver. Given ONE canonical
concept and N claim pairs (two claim excerpts each), decide whether the
two claims in each pair express the same view, partially overlap, or
contradict each other.

Reply with a single JSON object only. No markdown, no commentary outside
JSON.

You decide ONLY the per-pair verdict. You NEVER generate
canonical_claim_id, decision_id, or any persistent identifier. The
script derives every identifier from pair_id + canonical_id + decision
type via a deterministic hash."""

[user]
template = """\
Canonical concept:
  canonical_id: {canonical_id}

Claim pairs (compare text_a vs text_b; emit pair_id verbatim):
{claim_pairs_text}

Pair count: {pair_count} (capped at {max_pairs})

For each pair, return a verdict using EXACTLY these strings:
  - "same":       the two claims express the same view
  - "overlap":    they partially overlap but are not identical
  - "conflict":   they contradict each other
  - "unresolved": insufficient evidence to decide

Respond with JSON in exactly this shape:
{{"verdicts": [{{"pair_id": "claim_id_A|claim_id_B", "decision": "same|overlap|conflict|unresolved", "confidence": 0.0..1.0, "reason": "<=30 chars"}}]}}"""

[output_schema]
type = "json"
required = ["verdicts"]

[[slot]]
name = "canonical_id"
required = true

[[slot]]
name = "claim_pairs_text"
required = true
description = "Pre-formatted bounded evidence pack per claim pair"

[[slot]]
name = "max_pairs"
required = true
description = "Hard cap on pair count (50 — R1 audit hard requirement)"

[[slot]]
name = "pair_count"
required = true
description = "Number of pairs in this prompt"

[[slot]]
name = "decisions_block"
required = false
description = "Reserved slot for system-supplied decision examples (empty in v1)"
