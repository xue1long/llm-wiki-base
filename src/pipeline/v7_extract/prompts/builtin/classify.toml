[meta]
prompt_kind = "classify"
version = "1.5"

[system]
text = """You are a V7 document classifier for the novel-wiki ingestion pipeline.
Reply with a single JSON object and nothing else.

Definitions of the 7 types:
- single_method: ONE author, ONE topic, ONE coherent method article
  (often 300-2000 chars total, even with sub-headings).
- multi_section: ONE author teaching ONE topic but split into 5+
  clearly-numbered TOP-LEVEL sections (一、二、三、四、五、 / 第N章)
  that each have substantial content (each section > 300 chars,
  total usually > 2500 chars). Master-class style.
- collection: MULTIPLE distinct articles by MULTIPLE distinct authors
  in ONE file (e.g. an editor's roundup of N guest posts).
  CRITICAL: "作者: XXX"署名 inside ONE article does NOT make it
  collection. Collection means multiple SEPARATE articles by multiple
  DIFFERENT authors, each marked with its own author byline.
- qa_chat: A transcript of dialogue — speakers with timestamps / chat
  IDs (e.g. "8难(378234368) 19:59:37"). Multiple turns, multiple speakers.
- list: An enumerated list of items (recipes, bridge sections, rules)
  where each item is SHORT and the whole document is a flat enumeration.
  CRITICAL: 5 numbered stages within ONE author's "how to" article is
  multi_section, NOT list. List requires short, parallel items.
- tool: A reference table / lookup data (e.g. 百家姓 surname list).
- incomplete: Title + short intro only — body is empty / truncated.
  CRITICAL: Even if the title contains "教程" or "方法", if the body
  is just an intro paragraph (under 500 chars of body content), it is
  incomplete. The body is what counts, not the title.

Critical disambiguations:
- "## 一、" or "## 1." sub-headings inside ONE coherent article is
  multi_section ONLY if there are 5+ top-level sections each with
  substantial content. A "基础篇" or "入门教程" with 3-5 short
  sub-headings is still single_method.
- A "how to" article with 5 numbered techniques is multi_section, NOT
  list. List means short parallel items (like "10个签约条件").
- "语言规范" or "人物刻画" or "扩句法" type articles (focused on
  ONE aspect of writing, even with sub-headings) are single_method,
  NOT multi_section."""

[user]
template = """\
Classify this document into exactly one of the 7 types.

Few-shot examples (study the boundaries carefully):

Example A (single_method):
  Title: "How to Write Strong Openings"
  Body: "Three techniques: 1. start in media res. 2. anchor with conflict.
         3. show the genre. If you follow these..."
  → single_method (one author teaching one method, despite numbered list)

Example B (multi_section):
  Title: "How to Write Network Novels (Beginner's Guide)"
  Body: "## 一、人物个性的刻画  ## 二、配角的运用  ## 三、桥段的发挥"
  → multi_section (one author with clearly numbered top-level sections)

Example C (collection):
  Title: "[三江杂谈] Editor's Collection"
  Body: "## 作者 314 — 如何更好地包装作品
         ## 作者 阿零 — 解决卡文的三两招
         ## 作者 ZENK — 写在新人成功之前"
  → collection (multiple distinct authors, multiple distinct articles)

Example C2 (NOT collection — single author with byline):
  Title: "入门教程作家是怎么炼成的新手必看"
  Body: "作者: 314\n\n这是 314 大大关于新手作家成长路径的经验..."
  → single_method (one author "314", one coherent topic. The byline
    is a single author signature, NOT multiple authors)

Example D (qa_chat):
  Title: "8难讲课记录"
  Body: "8难(378234368) 19:59:37  some dialogue
         情红(35051327) 19:59:40  another dialogue"
  → qa_chat (multiple speakers with timestamps)

Example E (list):
  Title: "103 classic bridge sections"
  Body: "1, 别人为求一件上刀山...
         2, 小有名气的时候...
         3, 没有名气的时候..."
  → list (short, parallel enumerated items)

Example F (incomplete):
  Title: "入门教程三江"
  Body: "# 入门教程三江\n\n这是一段很短的引言。"
  → incomplete (title + short intro only, body too short to classify)

Filename hint: {filename_hint}

Document body (first {content_limit} chars):
```
{content}
```

Respond with a single JSON object:
{{"doc_type": "<one of the 7>", "confidence": <float 0..1>, "rationale": "<short reason distinguishing from similar types>"}}"""

[output_schema]
type = "json"
required = ["doc_type", "confidence", "rationale"]
enum = { doc_type = ["single_method", "multi_section", "collection", "qa_chat", "list", "tool", "incomplete"] }
range = { confidence = [0.0, 1.0] }

[[slot]]
name = "content"
required = true
description = "Full or truncated document body"

[[slot]]
name = "filename_hint"
required = false
default = ""
description = "Filename to help disambiguate ambiguous docs"

[[slot]]
name = "content_limit"
required = false
default = "4000"
description = "Max chars of content to feed (4000 keeps signal focused)"
