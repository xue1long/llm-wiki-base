[meta]
prompt_kind = "completeness"
version = "1.2"

[system]
text = """You are a V7 completeness checker for the novel-wiki ingestion pipeline.
Reply with a single JSON object only. Do not explain your reasoning."""

[user]
template = """\
Decide whether this source document is *complete* enough to be worth
extracting structured wiki pages from. Treat the Stage-1 doc_type as a
SOFT HINT — independently judge whether the *body* is substantial,
regardless of the hint.

A document is incomplete if:
  - It is only a title + short intro with no body content
  - The body is truncated mid-sentence (HEAD, TAIL, or any mid sample shows it)
  - It explicitly says "正文内容缺失" / "正文待补" / similar

Otherwise it is complete.

ASR transcript exemption (added 2026-09-19 v1.2): a spoken-word
transcript (audio-to-text / 语音转文字) commonly ends mid-sentence,
repeats the final sentence as a sign-off, or trails off with
filler words ("谢谢大家", "今天的课就到这里"). This is the natural
ending of an audio recording — NOT truncation. Judge the body by
whether the topics are covered (HEAD + 3 mid samples cover the core
content), NOT by whether TAIL ends on a sentence boundary.

In particular: repeated final sentences, trailing "帅的人已经加
我微信了"-style sign-offs, and TAIL that ends mid-phrase are all
NORMAL for audio transcripts and must NOT trigger an INCOMPLETE verdict.

Bounded evidence pack (HEAD + TAIL + 3 mid samples + Stage 2 signals),
total ≤ {content_limit} bytes:
```
{evidence_pack}
```

Stage-1 hint (may be wrong — judge independently): doc_type = {doc_type_hint}

Respond with JSON:
{{"complete": <bool>, "reason": "<short reason>"}}"""

[output_schema]
type = "json"
required = ["complete", "reason"]

[[slot]]
name = "evidence_pack"
required = true
description = "Bounded evidence pack (HEAD/TAIL + 3 mid samples + Stage 2 signals)"

[[slot]]
name = "text"
required = true
description = "Full document body (kept for back-compat; renderer no longer injects it into the user template)"

[[slot]]
name = "doc_type_hint"
required = false
default = "unknown"
description = "Soft hint from Stage 1 (do not trust blindly)"

[[slot]]
name = "content_limit"
required = false
default = "5500"
description = "Hard byte budget for the bounded evidence pack"
