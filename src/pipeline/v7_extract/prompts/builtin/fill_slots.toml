[meta]
prompt_kind = "fill_slots"
version = "2.0"

[system]
text = """You are a V7 concept-page slot filler for the novel-wiki ingestion
pipeline. For each slot you fill, you MUST also supply evidence pointing
back to the source material — cite by ZERO-BASED INTEGER INDEX into the
numbered item list (see user prompt). You may also include a
source_text_excerpt (literal substring from the source) as a human-review
reference, but the excerpt is NOT validated — only the integer index is.

Do not fabricate. If you cannot find evidence, set the slot body to
the placeholder "需结合原文核对" — the pipeline will mark it as
needs_review and route it to a human.

Reply with a single JSON object only. No markdown, no explanation."""

[user]
template = """\
Fill the 8 required slots of a concept page for this topic.

Topic title: {title}
Source material (numbered item list — cite by zero-based integer index):
{items_text}

Source content (first {content_limit} chars):
```
{source_text}
```
Required slots:
{slot_list}

For each slot, return body text + evidence. item_index MUST be an integer
in the range [0, N-1] where N is the number of items in the list above.

Example output shape:
{{
  "slots": {{
    "definition": "<definition text>",
    "characteristics": "<characteristics text>",
    "context": "<when/where to use text>",
    "anti_patterns": "<common mistakes text>",
    "evidence": "<evidence strength text>",
    "examples": "<examples text>",
    "related_concepts": "<related concepts text>",
    "references": "<references text>"
  }},
  "evidence": {{
    "definition": {{"item_index": 0, "source_text_excerpt": "<literal substring>"}},
    "characteristics": {{"item_index": 1, "source_text_excerpt": "<literal substring>"}},
    "context": {{"item_index": 0, "source_text_excerpt": "<literal substring>"}},
    "anti_patterns": {{"item_index": 2, "source_text_excerpt": "<literal substring>"}},
    "evidence": {{"item_index": 0, "source_text_excerpt": "<literal substring>"}},
    "examples": {{"item_index": 3, "source_text_excerpt": "<literal substring>"}},
    "related_concepts": {{"item_index": 0, "source_text_excerpt": "<literal substring>"}},
    "references": {{"item_index": 0, "source_text_excerpt": "<literal substring>"}}
  }}
}}"""

[output_schema]
type = "json"
required = ["slots", "evidence"]

[[slot]]
name = "title"
required = true
description = "Topic title (becomes the concept-page title)"

[[slot]]
name = "items_text"
required = true
description = "Numbered item list: '<index>: <item_id>\\n<text snippet>'"

[[slot]]
name = "source_text"
required = true
description = "Raw source content the LLM draws from"

[[slot]]
name = "content_limit"
required = false
default = "12000"
description = "Max chars of source_text to feed"

[[slot]]
name = "slot_list"
required = true
description = "Comma-separated list of slot names (definition, characteristics, ...)"
