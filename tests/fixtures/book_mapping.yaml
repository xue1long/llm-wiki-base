# Gold standard for B-T2 KU → Chapter Mapper (spec §12.5 + §14 A8 step 1243 + §17 D-18).
#
# Each case asserts one mapping decision. The accuracy metric is the fraction
# of cases where (chapter_id, stable_key, confidence, reason) ALL match.
#
# Gate A8 requires accuracy >= 0.90. This dataset exercises:
#   - 8 exact_ku_match (KU id is already in source_knowledge_unit_ids)
#   - 6 exact_stable_key (mapping hint provided, chapter found by stable_key)
#   - 8 concept_unit_type_match (no exact hit, derivation matches)
#   - 6 needs_new_chapter (no match at all)
#   - 4 edge / boundary (empty registry, multiple matches, hint collision, etc.)
#
# Stable key derivation rule (B-T2 canonical):
#     derive_stable_key(ku) = f"{ku.concept_id}::{ku.unit_type}"
#
# Resolution order (must match §9 / A3 + task spec):
#     1. exact_ku_match        confidence 1.00  reason="exact_ku_match"
#     2. exact_stable_key      confidence 0.95  reason="exact_stable_key"
#     3. concept_unit_type     confidence 0.85  reason="concept_unit_type_match"
#     4. needs_new_chapter     confidence 0.00  reason="needs_new_chapter"

# ─── exact_ku_match (8 cases) ────────────────────────────────────────────

- case_id: case_001
  description: KU id is in chapter.source_knowledge_unit_ids — exact hit, 1.0
  ku:
    id: ku_001_def_intent
    concept_id: concept_intent_design
    unit_type: definition
  existing_chapters:
    - chapter_id: ch_001_intent_def
      stable_key: concept_intent_design::definition
      source_knowledge_unit_ids: [ku_001_def_intent, ku_001_other]
  expected:
    chapter_id: ch_001_intent_def
    stable_key: concept_intent_design::definition
    confidence: 1.0
    reason: exact_ku_match

- case_id: case_002
