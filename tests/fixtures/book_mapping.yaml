      stable_key: concept_ledger_storage::definition
      source_knowledge_unit_ids: [ku_031_match]
    - chapter_id: ch_031_ledger_pat
      stable_key: concept_ledger_storage::pattern
      source_knowledge_unit_ids: []
  expected:
    chapter_id: ch_031_ledger_def
    stable_key: concept_ledger_storage::definition
    confidence: 1.0
    reason: exact_ku_match

