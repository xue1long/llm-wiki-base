known_limitations:
  - "ApprovalGate 是 in-memory 字典存储；cross-process 调用方需各自实例化（commit 2 dedup_auto 集成时确认）"
  - "check_authorization 当前仅检查 approved 状态；rejected approval 不阻止后续重提（spec §5.11 未强制 unique constraint）"
  - "persist_approvals 不并发安全：多次并发 append 可能丢失行，由 caller 保证 serialize"
  - "Approval dataclass 是 frozen；approve/reject 返回新 Approval 实例（不可变 dataclass 模式）"
  - "src/kc/governance/ 包尚未被现有 kc 流程主动调用（无 coupling）；commit 2 (dedup_auto --require-approval) 才会接入"

