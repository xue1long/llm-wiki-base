- task_id: AT-008
  query: "Integrity Gate 阻断验证 — inferred evidence 是否单独支撑 observed fact？"
  expected_knowledge_units: []  # 不应返回（inferred 单独不能支撑 observed）
  expected_citations: []
  expected_knowledge_modes: ["observed"]
  expected_conflict_status: ["none"]
  success_criteria:
    min_units_returned: 0  # 期望 0 unit（被 Integrity Gate 阻断）
    min_citations_valid: 0
    knowledge_mode_identified: true
    citations_match: true
  mock_response:
    knowledge_items: []  # Agent 应当不返回任何 unit
    omitted_candidates:
      - knowledge_unit_id: "ku_inferred_test"
        reason: "integrity_block"
  tag: full
  confidence: high
  notes: "inferred 单独不能支撑 observed fact，应被 Integrity Gate 阻断（spec §6 E-4）"

