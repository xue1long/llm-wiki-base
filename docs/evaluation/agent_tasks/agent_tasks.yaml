# Knowledge Compiler v2.1 Agent Task 评估集 (C-3.5 / Z-3)
# spec §12.3 Agent Context 输出 schema + §15 V-14 + §17 D-15
#
# 模式 A: dry-run with mock agent runtime
#   - 不实际调用 LLM/agent runtime
#   - mock_response 模拟 agent 应返回的 Agent Context 输出
#   - evaluator 根据 success_criteria 判定 PASS/FAIL
#   - 真实 agent runtime 集成是 Z-3 后续任务
#
# Agent Context schema (spec §12.3):
#   {
#     task_id, query, query_time, requested_context,
#     publication_version,
#     knowledge_items: [{knowledge_unit_id, knowledge_mode, statements,
#                        evidence_refs, conflict_status, confidence}],
#     omitted_candidates: [{knowledge_unit_id, reason}]
#   }
#
# 评估维度:
#   - retrieval (AT-001, AT-002, AT-007)
#   - knowledge_mode (AT-003)
#   - temporal/conflict (AT-004)
#   - context/identity (AT-005, AT-006)
#   - integrity_gate (AT-007, AT-008)
#   - default_filter (AT-009)
#   - schema_validation (AT-010)
#
# 阈值 (spec §17 D-15):
#   - Agent Task Success Rate >= 0.85
#   - Citation Accuracy >= 0.95

- task_id: AT-001
  query: "找出关于'期待感'的最新 Claim，要求至少 2 个独立 medium Evidence"
  expected_knowledge_units: ["ku_期待感_v2", "ku_期待感_build"]
  expected_citations: ["ev_doc_001_quote", "ev_doc_002_quote"]
  expected_knowledge_modes: ["observed", "observed"]
  expected_conflict_status: ["none", "none"]
  success_criteria:
    min_units_returned: 2
    min_citations_valid: 2
    knowledge_mode_identified: true
    citations_match: true
  mock_response:
    knowledge_items:
      - knowledge_unit_id: "ku_期待感_v2"
        knowledge_mode: "observed"
        statements: ["期待感是网络小说最重要的内核元素"]
        evidence_refs: ["ev_doc_001_quote"]
        conflict_status: "none"
        confidence: 0.90
      - knowledge_unit_id: "ku_期待感_build"
        knowledge_mode: "observed"
        statements: ["期待感通过 7 步构建"]
        evidence_refs: ["ev_doc_002_quote"]
        conflict_status: "none"
        confidence: 0.85
    omitted_candidates: []
  tag: full
  confidence: high

