# KC MVP evaluation baseline (Task 6, plan 2026-08-29-...)
# =========================================================
#
# Task 6 / P1 gate "30–50 真实领域评估基线" — 30 MVP cases covering the
# minimum dimension matrix the KC needs to publish a credible pass/fail
# signal. Each case declares the full schema (see _schema.yaml) plus an
# explicit `mode` and `runtime_verified` flag so the evaluator can split
# mock results from product pass rate.
#
# Dimension coverage (30 cases):
#   - source_trust          5 cases (primary, official, internal, rejected, restricted)
#   - evidence_span         6 cases (direct_quote, structured_source, code, computed, multi_source, inferred)
#   - identity              5 cases (merge, split, supersede, keep_separate, alias)
#   - conflict              8 cases (none, actual, conditional, temporal, perspective, unresolved, supersede, type-mismatch)
#   - retrieval             3 cases (top-k, citation accuracy, mode=unknown)
#   - temporal              3 cases (current, scheduled, historical)

- case_id: ST-MVP-01
  query: How do we classify a primary-authority source as accepted?
  source_type: manual
  language: en
  context: {domain: knowledge_management, platform: web}
  query_time: 1734567890000
  object_truth: {type: source_trust_profile, id: stp_primary_mvp}
  identity_key: id-v1:mvp_stp_primary
  resolution_action: create
  integrity_status: verified
  expected_top_k:
  - {knowledge_unit_id: ku_trust_primary, score: 0.95}
  evidence_refs: [ev_primary_doc_001]
  task_result: success
  tag: full
  coverage_dimension: source_trust.primary
  confidence: high
  mode: mock
  runtime_verified: false

